coverage_server:
  ros__parameters:
    use_sim_time: true

    # Robot / operation model
    robot_width: 0.18
    operation_width: 0.18
    min_turning_radius: 0.2
    linear_curv_change: 50.0

    # Coordinate type for incoming ComputeCoveragePath goals
    coordinates_in_cartesian_frame: true

    # Default mode parameters (can be overridden per action goal)
    default_allow_overlap: false
    default_headland_type: "CONSTANT"
    default_headland_width: 0.1

    default_swath_type: "LENGTH"
    default_swath_angle_type: "BRUTE_FORCE"
    default_swath_angle: 0.0
    default_step_angle: 0.0872665  # 5 deg

    default_route_type: "BOUSTROPHEDON"
    default_spiral_n: 3

    default_path_type: "DUBIN"
    default_path_continuity_type: "CONTINUOUS"
    default_turn_point_distance: 0.1
